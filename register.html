<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learnexus Register</title>
  <style>
    :root {
      --bg: #f4f5f9;
      --panel: #ffffff;
      --primary: #2c6df2;
      --text: #222;
      --muted: #6f7380;
      --border: #d9deeb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: #ffffff;
      color: var(--text);
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 32px;
      font-size: 13px;
      color: var(--muted);
      background: #e3e7f5;
      border-bottom: 1px solid #d0d6ea;
    }
    .brand-text {
      font-weight: 800;
      letter-spacing: 0.08em;
      font-size: 12px;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar-right span {
      color: var(--muted);
    }
    .login-btn {
      padding: 6px 18px;
      border-radius: 4px;
      border: 1px solid #c9cee0;
      background: #ffffff;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
    }
    .login-btn:hover {
      border-color: #aeb6d4;
      background: #f3f4fb;
    }
    .page {
      display: flex;
      justify-content: center;
      padding: 56px 16px 72px;
      background: #ffffff;
    }
    .card {
      width: min(820px, 100%);
      background: var(--panel);
      border: 2px solid var(--primary);
      border-radius: 3px;
      padding: 32px 40px 32px;
      box-shadow: none;
    }
    h1 {
      text-align: center;
      margin: 0;
      font-size: 28px;
    }
    .subtext {
      text-align: center;
      margin: 6px 0 26px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }
    form {
      display: grid;
      gap: 16px;
    }
    .row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .row-two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #3a3a3a;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(44, 109, 242, 0.12);
    }
    .input-icon {
      position: relative;
    }
    .input-icon input {
      padding-right: 38px;
    }
    .input-icon span {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: #b0b4c2;
      pointer-events: none;
    }
    .submit-btn {
      margin-top: 10px;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    .submit-btn:hover { background: #1f5bd4; }
    .footer-strip {
      height: 56px;
      background: var(--bg);
    }
    @media (max-width: 720px) {
      .row, .row-two { grid-template-columns: 1fr; }
      .card { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand-text">LEARNEXUS</div>
    <div class="topbar-right">
      <span>Already a member?</span>
      <a href="index.html" class="login-btn">Login</a>
    </div>
  </div>

  <div class="page">
    <div class="card">
      <h1>Create your account</h1>
      <p class="subtext">
        Join Learnexus to start managing your courses and tracking your progress today.
      </p>

      <form>
        <div class="row">
          <div>
            <label for="firstName">First Name</label>
            <input id="firstName" type="text" placeholder="Jane">
          </div>
          <div>
            <label for="middleInitial">M.I.</label>
            <input id="middleInitial" type="text" placeholder="L.">
          </div>
          <div>
            <label for="lastName">Last Name</label>
            <input id="lastName" type="text" placeholder="Doe">
          </div>
        </div>

        <div>
          <label for="email">Email address</label>
          <div class="input-icon">
            <input id="email" type="email" placeholder="jane@example.com">
            <span>&#9993;</span>
          </div>
        </div>

        <div>
          <label for="phone">Phone</label>
          <div class="input-icon">
            <input id="phone" type="tel" placeholder="+63 909 999 9999">
            <span>&#128222;</span>
          </div>
        </div>

        <div class="row-two">
          <div>
            <label for="password">Password</label>
            <div class="input-icon">
              <input id="password" type="password" placeholder="••••••••••">
              <span>&#128065;</span>
            </div>
          </div>
          <div>
            <label for="confirmPassword">Confirm Password</label>
            <input id="confirmPassword" type="password" placeholder="••••••••••">
          </div>
        </div>

        <button type="submit" class="submit-btn">Create Account</button>
      </form>
    </div>
  </div>
  <div class="footer-strip"></div>
</body>
</html>

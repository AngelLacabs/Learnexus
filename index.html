<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learnexus Login</title>
  <style>
    :root {
      --bg: #e3e7f5;
      --panel: #ffffff;
      --primary: #2c6df2;
      --text: #222;
      --muted: #6f7380;
      --border: #d9deeb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .page {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      min-height: 100vh;
    }
    .left {
      display: grid;
      place-items: center;
      padding: 48px;
    }
    .left img {
      width: 75%;
      max-width: 360px;
      height: auto;
      display: block;
    }
    .right {
      background: var(--panel);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 40px;
    }
    .card {
      width: min(420px, 100%);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .brand {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #444;
    }
    h1 {
      margin: 4px 0 2px;
      font-size: 28px;
    }
    .subtext {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
    }
    label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #3a3a3a;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(44, 109, 242, 0.12);
    }
    .password-row {
      position: relative;
    }
    .password-eye {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      color: #9aa0b5;
      cursor: pointer;
      user-select: none;
    }
    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--muted);
      margin-top: -4px;
    }
    .actions a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .checkbox input {
      width: 14px;
      height: 14px;
    }
    .primary-btn {
      width: 100%;
      padding: 12px 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }
    .primary-btn:hover { background: #1f5bd4; }
    .divider {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      margin: 8px 0;
    }
    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: var(--border);
    }
    .outline-btn {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      justify-content: center;
      gap: 8px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .outline-btn:hover {
      border-color: #c3c8d8;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .footer {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }
    .footer a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }
    @media (max-width: 900px) {
      .page { grid-template-columns: 1fr; }
      .left { display: none; }
      .right { padding: 48px 24px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="left">
      <img src="C:\Users\andrew\Downloads\Attached_image.png" alt="Learnexus logo">
    </div>
    <div class="right">
      <div class="card">
        <div class="brand">LEARNEXUS</div>
        <h1>Welcome back!</h1>
        <p class="subtext">Access your courses and track your progress.</p>

        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="student@learnexus.edu">
        </div>

        <div class="field password-row">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••••">
          <span class="password-eye">&#128065;</span>
        </div>

        <div class="actions">
          <label class="checkbox">
            <input type="checkbox"> <span>Remember me</span>
          </label>
          <a href="#">Forgot Password?</a>
        </div>

        <button class="primary-btn">Login</button>

        <div class="divider">Or continue with</div>
        <button class="outline-btn">Google</button>

        <div class="footer">
          Don’t have an account? <a href="#">Sign up for free</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
